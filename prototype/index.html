<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NekroNXT 对象语言原型" />
    <title>NekroNXT · 原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="proto-bar">
      <strong>原型</strong>
      <label>
        场景
        <select id="sceneSelect" aria-label="选择演示场景">
          <option value="running">进行中</option>
          <option value="done">已完成</option>
          <option value="work">工作轨迹</option>
          <option value="web">网页频道</option>
          <option value="unbound">未绑定</option>
          <option value="first">第一次</option>
          <option value="create">创建</option>
          <option value="workbench">智能体</option>
          <option value="connect">连接</option>
          <option value="bind">绑定</option>
          <option value="creator">创造</option>
          <option value="creator-empty">创造空态</option>
          <option value="extension">扩展</option>
          <option value="settings">设置</option>
        </select>
      </label>
      <button type="button" id="themeToggle">深色</button>
    </div>

    <div class="shell" id="shell">
      <aside class="rail" id="rail" aria-label="模式"></aside>
      <aside class="tree" id="tree" aria-label="对象列"></aside>
      <main class="canvas" id="canvas" tabindex="-1"></main>
      <aside class="inspector" id="inspector" aria-label="检查器"></aside>
    </div>

    <div id="overlay" class="overlay" hidden></div>
    <div id="toastRegion" class="toast-region" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
