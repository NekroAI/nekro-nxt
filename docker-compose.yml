services:
  nekro-nxt:
    build:
      context: .
      args:
        NEKRO_RELEASE_ID: '${NEKRO_RELEASE_ID:-0.0.0+local}'
    environment:
      NEKRO_RELEASE_ID: '${NEKRO_RELEASE_ID:-0.0.0+local}'
    ports:
      - '${NEKRO_BIND_ADDRESS:-127.0.0.1}:4960:4960'
    volumes:
      - nekro-nxt-data:/data
    restart: unless-stopped

volumes:
  nekro-nxt-data:
