name: 功能建议
description: 说明一个真实用户问题和期望能力
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景下遇到什么阻碍？
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前做法
      description: 现在如何处理，为什么不够？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述可观察到的产品结果，不要求预先指定内部实现。
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 边界与兼容性
      description: 是否影响频道隔离、智能体版本、扩展生命周期、Desktop/Server 或 DSH 兼容？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索现有 Issue 和公开文档。
          required: true
        - label: 示例只使用虚构数据。
          required: true
