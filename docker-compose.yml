services:
  nekro-nxt:
    image: '${NEKRO_IMAGE:-ghcr.io/nekroai/nekro-nxt:latest}'
    environment:
      NEKRO_MANAGEMENT_KEY: '${NEKRO_MANAGEMENT_KEY:?请设置至少 32 个字符的 NEKRO_MANAGEMENT_KEY}'
    ports:
      - '${NEKRO_BIND_ADDRESS:-127.0.0.1}:4960:4960'
    volumes:
      - nekro-nxt-data:/data
    restart: unless-stopped

volumes:
  nekro-nxt-data:
