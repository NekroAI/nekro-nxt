name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - id: release
        name: Verify release source, version and reviewed notes
        run: node scripts/stable-release-ci.mjs verify

  desktop:
    name: stable-desktop (${{ matrix.target }})
    needs: verify
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            runner: macos-15
          - target: win
            runner: windows-2025
          - target: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Desktop Stable
        run: pnpm desktop:stable --platform ${{ matrix.target }}
      - name: Store installers and receipts
        uses: actions/upload-artifact@v4
        with:
          name: stable-desktop-${{ matrix.target }}-${{ needs.verify.outputs.commit }}
          path: |
            apps/desktop/release/stable/*.dmg
            apps/desktop/release/stable/*.exe
            apps/desktop/release/stable/*.AppImage
            apps/desktop/release/stable/*.receipt.json
          if-no-files-found: error
          retention-days: 1

  server:
    name: stable-server (linux-x64)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Server Stable candidate
        env:
          NEKRO_DESKTOP_CHANNEL: stable
          NEKRO_IMAGE: ghcr.io/nekroai/nekro-nxt:release-${{ needs.verify.outputs.commit }}
        run: node scripts/build-server-image.mjs
      - name: Push Server Stable candidate
        run: docker push ghcr.io/nekroai/nekro-nxt:release-${{ needs.verify.outputs.commit }}

  publish:
    needs: [verify, desktop, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Download installers and receipts
        uses: actions/download-artifact@v4
        with:
          pattern: stable-desktop-*-${{ needs.verify.outputs.commit }}
          path: .local/stable-release
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify artifacts and publish Stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stable-release-ci.mjs publish --artifacts-dir .local/stable-release
