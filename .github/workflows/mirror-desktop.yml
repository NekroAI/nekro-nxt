name: Mirror desktop installers

# Copies what the GitHub release of a channel serves now to the public download mirror (dl.nekro.ai), checking every
# installer against GitHub's digest. The release workflows mirror on their own; this is for a sync they missed.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Which release to mirror
        type: choice
        options: [both, stable, preview]
        default: both

permissions:
  contents: read

concurrency:
  group: preview-publish
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ vars.R2_ACCOUNT_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Mirror
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          for channel in stable preview; do
            if [ "$CHANNEL" = both ] || [ "$CHANNEL" = "$channel" ]; then
              node scripts/mirror-desktop-release.mjs "$channel" --from-github
            fi
          done
