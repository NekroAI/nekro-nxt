name: Android Release

# The formal Android release (decision A7) rides the NekroNXT stable release: release.yml calls this for every
# `vX.Y.Z` tag, and the APK takes the same version. It is skipped when apps/android has not changed since the last
# `android-v*` release, so installed phones are not offered an identical update. Run it by hand on a `vX.Y.Z` tag
# (with force) to repair a failed run or to ship a shell-only fix. The `android-release` environment holds the
# release signing key and only admits `v*.*.*` tags.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      force:
        description: 安卓壳没有改动也发布
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    concurrency:
      group: android-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Decide whether the shell changed
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*.*.*) ;; *) echo "只能在 vX.Y.Z 标签上运行：$GITHUB_REF"; exit 1 ;; esac
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "android-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "android-v$version 已发布，跳过。"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git tag --list 'android-v*' --sort=-v:refname --merged HEAD | head -1)
          if [ "$FORCE" != true ] && [ -n "$last" ] && git diff --quiet "$last" HEAD -- apps/android; then
            echo "apps/android 自 $last 以来没有改动，跳过。"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.release == 'true'
        with:
          node-version: 22.23.2
      - uses: actions/setup-java@v4
        if: steps.check.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.release == 'true'
      - name: Version and release key
        if: steps.check.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          version="${{ steps.check.outputs.version }}"
          test -n "$KEYSTORE_BASE64" || { echo "android-release 环境缺少 ANDROID_RELEASE_KEYSTORE_BASE64。"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "NXT_ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "NXT_ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "NXT_ANDROID_VERSION_CODE=$(node -e "import('./scripts/android-release.mjs').then((m) => console.log(m.stableVersionCode('$version')))")" >> "$GITHUB_ENV"
      - name: Build and sign
        if: steps.check.outputs.release == 'true'
        working-directory: apps/android
        env:
          NXT_ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          NXT_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          NXT_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Name the APK and write its receipt
        if: steps.check.outputs.release == 'true'
        run: |
          mkdir -p .local/android-release
          node scripts/android-release.mjs candidate stable --apk apps/android/app/build/outputs/apk/release/app-release.apk --out-dir .local/android-release
      # Never marked latest: the latest release is the desktop and server release that the download page and the
      # desktop updater read.
      - name: Publish the GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt=$(ls .local/android-release/*.apk.receipt.json)
          apk="${receipt%.receipt.json}"
          certificate=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$receipt','utf8')).certificateSha256)")
          sha=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$receipt','utf8')).sha256)")
          {
            echo "NekroNXT 安卓应用 $NXT_ANDROID_VERSION_NAME，Android 10 及以上。"
            echo
            echo "安装后在已登录的电脑或浏览器上打开「设置 → 登录与访问 → 连接安卓应用」，用应用扫码连接。说明见[手机使用说明](https://nxt.nekro.ai/docs/install/mobile)。"
            echo
            echo "- 安装包 SHA-256：\`$sha\`"
            echo "- 签名证书 SHA-256：\`$certificate\`"
          } > .local/android-release/notes.md
          gh release create "android-v$NXT_ANDROID_VERSION_NAME" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NekroNXT Android $NXT_ANDROID_VERSION_NAME" \
            --notes-file .local/android-release/notes.md \
            --latest=false
      - name: Mirror to dl.nekro.ai
        if: ${{ steps.check.outputs.release == 'true' && vars.R2_ACCOUNT_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/android-release.mjs mirror stable --artifacts-dir .local/android-release
