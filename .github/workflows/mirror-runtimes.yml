name: Mirror runtimes

# Copies the third-party runtimes NekroNXT can download (附加功能), pinned in scripts/runtime-mirror.json, to the
# public download mirror (dl.nekro.ai). Run it after changing a pin; files already there are skipped.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/runtime-mirror.json]

permissions:
  contents: read

jobs:
  mirror:
    if: ${{ vars.R2_ACCOUNT_ID != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Mirror
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/mirror-runtimes.mjs
