name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The four quality jobs run side by side; each one needs nothing the others produce.
  quality:
    concurrency:
      group: quality-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  coverage:
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The login page tests drive a real browser (passkeys, camera scanning).
      # security.ubuntu.com is not always reachable from GitHub's runners; their Azure mirror carries the same
      # security pocket, and apt still checks every package against Ubuntu's signing keys.
      - name: Use the Azure mirror for Ubuntu security updates
        run: grep -rlE 'security\.ubuntu\.com' /etc/apt | xargs -r sudo sed -i -E 's#https?://security\.ubuntu\.com#http://azure.archive.ubuntu.com#g'
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm test:coverage

  # One job per group (playwright.browser.config.ts): the largest files alone, the rest together.
  browser:
    name: browser (${{ matrix.group }})
    concurrency:
      group: browser-${{ matrix.group }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [app, settings, shell, rest]
    env:
      NEKRO_BROWSER_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # security.ubuntu.com is not always reachable from GitHub's runners; their Azure mirror carries the same
      # security pocket, and apt still checks every package against Ubuntu's signing keys.
      - name: Use the Azure mirror for Ubuntu security updates
        run: grep -rlE 'security\.ubuntu\.com' /etc/apt | xargs -r sudo sed -i -E 's#https?://security\.ubuntu\.com#http://azure.archive.ubuntu.com#g'
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      # The pages resolve workspace packages to source, but the Playwright specs import their built entries.
      - run: pnpm build
      - run: pnpm test:browser

  # Two jobs (playwright.config.ts): the two longest files, and every other file.
  journey:
    name: journey (${{ matrix.group }})
    concurrency:
      group: journey-${{ matrix.group }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [longest, rest]
    env:
      NEKRO_JOURNEY_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # security.ubuntu.com is not always reachable from GitHub's runners; their Azure mirror carries the same
      # security pocket, and apt still checks every package against Ubuntu's signing keys.
      - name: Use the Azure mirror for Ubuntu security updates
        run: grep -rlE 'security\.ubuntu\.com' /etc/apt | xargs -r sudo sed -i -E 's#https?://security\.ubuntu\.com#http://azure.archive.ubuntu.com#g'
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - run: pnpm build
      - run: pnpm test:journey:built
      - name: Upload product journey failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.group }}-${{ github.run_attempt }}
          path: .local/playwright-results
          if-no-files-found: warn
          retention-days: 7

  node-compat:
    concurrency:
      group: node-compat-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:better-sqlite3
      # The login page tests drive a real browser (passkeys, camera scanning).
      # security.ubuntu.com is not always reachable from GitHub's runners; their Azure mirror carries the same
      # security pocket, and apt still checks every package against Ubuntu's signing keys.
      - name: Use the Azure mirror for Ubuntu security updates
        run: grep -rlE 'security\.ubuntu\.com' /etc/apt | xargs -r sudo sed -i -E 's#https?://security\.ubuntu\.com#http://azure.archive.ubuntu.com#g'
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm test

  all-checks-passed:
    if: always()
    needs: [quality, coverage, browser, journey, node-compat]
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success,success"

  upgrade-candidates:
    name: Upgrade candidate (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            runner: macos-15
          - target: win
            runner: windows-2025
          - target: linux
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Windows disk flushes and file scanning can exceed Vitest's 5s default.
      # This bounds fixture execution, not the product's startup deadlines.
      - run: pnpm test:upgrade --testTimeout ${{ matrix.target == 'win' && '30000' || '5000' }}
      - name: Build and verify the bundled Desktop runtime
        run: pnpm desktop:preview --platform ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-candidate-${{ matrix.target }}-${{ github.sha }}
          compression-level: 0
          path: |
            apps/desktop/release/preview/*.dmg
            apps/desktop/release/preview/*.exe
            apps/desktop/release/preview/*.AppImage
            apps/desktop/release/preview/*.receipt.json
          if-no-files-found: error
          retention-days: 3

  # Preview builds start alongside the checks; only preview-finalize waits for all-checks-passed before publishing.
  preview-prepare:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      # Preview must not ship an extension capability level the community cannot validate yet (docs/09 §5).
      - name: Require the extension capability level on npm
        run: node scripts/check-published-extension-sdk.mjs
      - name: Compare against last successful Preview
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-product-changes.mjs

  preview-desktop:
    name: preview-desktop (${{ matrix.target }})
    needs: preview-prepare
    if: needs.preview-prepare.outputs.build == 'true'
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            runner: macos-15
          - target: win
            runner: windows-2025
          - target: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Desktop Preview
        run: pnpm desktop:preview --platform ${{ matrix.target }}
      - name: Store complete candidates for final verification
        uses: actions/upload-artifact@v4
        with:
          name: preview-candidates-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          compression-level: 0
          path: |
            apps/desktop/release/preview/*.dmg
            apps/desktop/release/preview/*.exe
            apps/desktop/release/preview/*.AppImage
            apps/desktop/release/preview/*.receipt.json
          if-no-files-found: error
          retention-days: 1

  # The Android development app (ai.nekro.nxt.dev) for the same Preview; its version counts up with each CI run so
  # the in-app update sees every new Preview.
  preview-android:
    needs: preview-prepare
    if: needs.preview-prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Development signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "缺少开发签名密钥 ANDROID_DEV_KEYSTORE_BASE64。"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.keystore"
          echo "NXT_ANDROID_DEV_KEYSTORE=$RUNNER_TEMP/dev.keystore" >> "$GITHUB_ENV"
          base=$(sed -n 's/.*versionName = ciVersionName ?: "\(.*\)"/\1/p' apps/android/app/build.gradle.kts)
          echo "NXT_ANDROID_VERSION_NAME=$base-preview.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "NXT_ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build Android Preview
        working-directory: apps/android
        env:
          NXT_ANDROID_DEV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          NXT_ANDROID_DEV_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          NXT_ANDROID_DEV_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK and write its receipt
        run: |
          mkdir -p .local/preview-android
          node scripts/android-release.mjs candidate preview --apk apps/android/app/build/outputs/apk/debug/app-debug.apk --out-dir .local/preview-android
      - uses: actions/upload-artifact@v4
        with:
          name: preview-candidates-android-${{ github.sha }}-${{ github.run_attempt }}
          compression-level: 0
          path: .local/preview-android/*
          if-no-files-found: error
          retention-days: 1

  # Each architecture is built and smoke-tested on its own native runner; preview-server merges them.
  preview-server-build:
    name: preview-server-build (linux-${{ matrix.arch }})
    needs: preview-prepare
    if: needs.preview-prepare.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      NEKRO_IMAGE: ghcr.io/nekroai/nekro-nxt:preview-${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Server Preview image
        env:
          NEKRO_DESKTOP_CHANNEL: preview
        run: node scripts/build-server-image.mjs
      - name: Verify Server image plugin lifecycle and restart recovery
        run: |
          container="nekro-nxt-preview-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" -e NEKRO_HOST=127.0.0.1 "$NEKRO_IMAGE"
          docker cp scripts/lib/managed-plugin-smoke.mjs "$container":/opt/nekro/server/managed-plugin-smoke.mjs
          for attempt in $(seq 1 60); do
            if docker exec "$container" node -e "fetch('http://127.0.0.1:4960/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi
            if [ "$attempt" = 60 ]; then docker logs "$container"; exit 1; fi
            sleep 1
          done
          docker exec "$container" node /opt/nekro/server/managed-plugin-smoke.mjs install http://127.0.0.1:4960 /data/managed-plugin-smoke.json
          docker restart "$container"
          for attempt in $(seq 1 60); do
            if docker exec "$container" node -e "fetch('http://127.0.0.1:4960/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi
            if [ "$attempt" = 60 ]; then docker logs "$container"; exit 1; fi
            sleep 1
          done
          docker exec "$container" node /opt/nekro/server/managed-plugin-smoke.mjs verify-remove http://127.0.0.1:4960 /data/managed-plugin-smoke.json
      # Both architectures push at once and share base layers; the registry now and then answers "unknown blob" to
      # one of them. A push is idempotent, so try again.
      - name: Push Server Preview candidate
        run: |
          for attempt in 1 2 3; do
            docker push "$NEKRO_IMAGE" && exit 0
            echo "push failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1

  preview-server:
    name: preview-server (linux-amd64, linux-arm64)
    needs: preview-server-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge architectures into the Server Preview candidate
        run: node scripts/merge-server-image.mjs ghcr.io/nekroai/nekro-nxt:preview-${{ github.sha }}
      - name: Record immutable Server candidate digest
        run: node scripts/rolling-preview-release.mjs record-server --output .local/server.receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: preview-candidates-server-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/server.receipt.json
          if-no-files-found: error
          retention-days: 1

  preview-finalize:
    if: always() && needs.all-checks-passed.result == 'success' && needs.preview-prepare.outputs.build == 'true' && needs.preview-desktop.result == 'success' && needs.preview-android.result == 'success' && needs.preview-server.result == 'success'
    needs: [all-checks-passed, preview-prepare, preview-desktop, preview-android, preview-server]
    concurrency:
      group: preview-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Download complete candidates
        uses: actions/download-artifact@v4
        with:
          pattern: preview-candidates-*-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/preview-candidates
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and publish all platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rolling-preview-release.mjs finalize --candidates-dir .local/preview-candidates --build-result success
      # Public download mirror of the installers (#87, bucket nekro-nxt-dist); off until the repository variable R2_ACCOUNT_ID is set.
      - name: Mirror installers to dl.nekro.ai
        if: ${{ vars.R2_ACCOUNT_ID != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/mirror-desktop-release.mjs preview --artifacts-dir .local/preview-candidates
      # The development APK and the manifest the app's in-app update reads (nxt/android/preview/manifest.json).
      - name: Mirror the Android APK to dl.nekro.ai
        if: ${{ vars.R2_ACCOUNT_ID != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/android-release.mjs mirror preview --artifacts-dir .local/preview-candidates
      # Documentation for nxt.nekro.ai/docs/preview, built from the same commit as the installers (docs/site/BUNDLE.md).
      - name: Publish Preview documentation
        if: ${{ vars.R2_ACCOUNT_ID != '' }}
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/docs-bundle.mjs build preview && node scripts/docs-bundle.mjs upload preview
