<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>NekroNXT</title>
    <link rel="stylesheet" href="./startup.css" />
    <script src="./data-move-view.js" defer></script>
  </head>
  <body>
    <header class="titlebar"><strong>NekroNXT</strong><span>数据目录</span></header>
    <main>
      <p id="eyebrow">更改数据目录</p>
      <h1 id="title">正在准备</h1>
      <p id="body" role="status" aria-live="polite"></p>
      <section id="progress-section" hidden aria-label="迁移进度">
        <progress id="progress" aria-label="已迁移的数据"></progress>
        <p id="progress-label"></p>
      </section>
      <p id="notice" hidden></p>
      <div class="actions">
        <button type="button" data-action="open" class="primary" hidden>打开 NekroNXT</button>
      </div>
      <details>
        <summary>查看诊断</summary>
        <pre id="diagnostics"></pre>
      </details>
      <p id="action-error" role="alert" hidden></p>
    </main>
  </body>
</html>
