name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Only re-points the shared packages' `latest` at the versions of an existing stable tag, without building: to repair
  # a failed last step, or to validate a newly created npm trusted publisher (npm wants one use within two days).
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的正式版 Tag，例如 v0.9.0
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - id: release
        name: Verify release source, version and reviewed notes
        run: node scripts/stable-release-ci.mjs verify
      - name: Verify the shared packages are on npm
        run: node scripts/promote-packages.mjs --check

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Point the shared packages' latest at this release
        run: |
          gh release view "$TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("不是已发布的正式版") else . end'
          npm install -g npm@12
          node scripts/promote-packages.mjs --reapply
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}

  desktop:
    name: stable-desktop (${{ matrix.target }})
    needs: verify
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            runner: macos-15
          - target: win
            runner: windows-2025
          - target: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Desktop Stable
        run: pnpm desktop:stable --platform ${{ matrix.target }}
      - name: Store installers and receipts
        uses: actions/upload-artifact@v4
        with:
          name: stable-desktop-${{ matrix.target }}-${{ needs.verify.outputs.commit }}
          path: |
            apps/desktop/release/stable/*.dmg
            apps/desktop/release/stable/*.exe
            apps/desktop/release/stable/*.AppImage
            apps/desktop/release/stable/*.receipt.json
          if-no-files-found: error
          retention-days: 1

  server-build:
    name: stable-server-build (linux-${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      NEKRO_IMAGE: ghcr.io/nekroai/nekro-nxt:release-${{ needs.verify.outputs.commit }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Server Stable candidate
        env:
          NEKRO_DESKTOP_CHANNEL: stable
        run: node scripts/build-server-image.mjs
      - name: Push Server Stable candidate
        run: docker push "$NEKRO_IMAGE"

  server:
    name: stable-server (linux-amd64, linux-arm64)
    needs: [verify, server-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge architectures into the Server Stable candidate
        run: node scripts/merge-server-image.mjs ghcr.io/nekroai/nekro-nxt:release-${{ needs.verify.outputs.commit }}

  publish:
    needs: [verify, desktop, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # npm trusted publishing: lets the last step move the shared packages' `latest` without a token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Download installers and receipts
        uses: actions/download-artifact@v4
        with:
          pattern: stable-desktop-*-${{ needs.verify.outputs.commit }}
          path: .local/stable-release
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub mirror of the Stable image; off until the repository variable DOCKERHUB_IMAGE is set.
      - if: ${{ vars.DOCKERHUB_IMAGE != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify artifacts and publish Stable
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: node scripts/stable-release-ci.mjs publish --artifacts-dir .local/stable-release
      # Public download mirror of the installers (#87, bucket nekro-nxt-dist); off until the repository variable R2_ACCOUNT_ID is set.
      - name: Mirror installers to dl.nekro.ai
        if: ${{ vars.R2_ACCOUNT_ID != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/mirror-desktop-release.mjs stable --artifacts-dir .local/stable-release
      # Only after the Release is out, so extension authors never get an SDK the stable NekroNXT does not know yet
      # (docs/09 §6). Needs each package's trusted publisher on npm with 「Allow npm dist-tag」, and npm ≥ 12.2.
      - name: Point the shared packages' latest at this release
        run: |
          npm install -g npm@12
          node scripts/promote-packages.mjs
